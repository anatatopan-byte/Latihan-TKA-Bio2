*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--pri)}h2{font-size:1.1rem;margin:0 0 8px}
.mut{color:var(--mut);font-size:.9rem}
input[type=text]{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.s{background:var(--pri2);color:var(--pri)}.btn.w2{background:var(--wrb);color:var(--wr)}.btn:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tm{font-weight:700;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:20px;background:var(--pri2);color:var(--pri)}.tm.warn{background:var(--badb);color:var(--bad)}
.pb{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:20px;background:var(--pri2);color:var(--pri);margin:0 6px 6px 0}
.qt{margin:6px 0 12px}.note{font-style:italic;color:var(--mut)}
.op{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;cursor:pointer}
.op input{margin-top:5px;flex:none}.op.ok{border-color:var(--ok);background:var(--okb)}.op.bad{border-color:var(--bad);background:var(--badb)}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid var(--ln);padding:8px;text-align:left;vertical-align:top}th{background:var(--bg)}td.c,th.c{text-align:center;width:72px}
.tw{overflow-x:auto}

sies ditulis dengan huruf kecil, yaitu *Zea mays*.", "key": [true, false, false, true, false], "sub": "Klasifikasi & Keanekaragaman Hayati"}, {"n": 3, "x": "Seorang vlogger pecinta alam bernama Rina melakukan perjalanan dari Kalimantan ke Sulawesi, lalu berakhir di Papua untuk mendokumentasikan keunikan fauna Indonesia. Berdasarkan prinsip biogeografi, fenomena apa saja yang paling mungkin Rina amati dan simpulkan dengan benar dalam catatannya? (Pilih semua jawaban yang benar dengan memberikan tanda centang pada kotak)", "t": "PGK", "o": ["Di Kalimantan, Rina banyak menemukan mamalia berukuran besar seperti orang utan dan bekantan yang menunjukkan ciri khas fauna tipe Asiatis.", "Semakin bergerak ke timur dari Kalimantan ke Sulawesi, jumlah spesies mamalia plasenta akan meningkat drastis.", "Di Sulawesi, Rina dapat menemukan hewan-hewan unik yang tidak ditemukan di zona Asiatis maupun Australis, seperti babi rusa dan tarsius.", "Fauna yang ditemui Rina di Papua, seperti burung cenderawasih dan kanguru pohon, memiliki kekerabatan yang lebih dekat dengan fauna di benua Australia.", "Garis Weber menjadi batas yang jelas di mana tidak ada lagi primata yang dapat ditemukan di sebelah timurnya."], "e": "Pernyataan 2 salah: semakin ke timur (menuju Australasia), jumlah spesies mamalia plasenta justru menurun, sedangkan marsupial meningkat.", "key": [0, 2, 3, 4], "sub": "Klasifikasi & Keanekaragaman Hayati"}, {"n": 4, "x": "Di Taman Nasional Ujung Kulon, populasi banteng jawa (*Bos javanicus*) dan badak bercula satu (*Rhinoceros sondaicus*) hidup dalam satu ekosistem. Keduanya merupakan herbivora besar yang dilindungi. Dilihat dari tingkat taksonominya, kedua hewan ini menunjukkan adanya keanekaragaman hayati karena mereka...", "t": "PG", "o": ["Berada dalam satu famili yang sama tetapi genus berbeda", "Berada dalam satu ordo yang sama tetapi famili berbeda", "Berada dalam satu kelas yang sama tetapi ordo berbeda", "Berada dalam satu genus yang sama tetapi spesies berbeda", "Berada dalam satu filum yang sama tetapi kelas berbeda"], "e": "Banteng termasuk Ordo Artiodactyla, badak termasuk Ordo Perissodactyla; keduanya sama-sama Kelas Mammalia.", "key": 2, "sub": "Klasifikasi & Keanekaragaman Hayati"}, {"n": 5, "x": "Konversi besar-besaran hutan hujan tropis di Sumatra menjadi perkebunan kelapa sawit telah menyebabkan fragmentasi habitat yang parah. Populasi Harimau Sumatra (*Panthera tigris sumatrae*) yang dulunya terhubung kini terisolasi dalam kantong-kantong hutan kecil. Berdasarkan prinsip biologi konservasi dan evolusi, dampak jangka panjang manakah yang paling signifikan dari situasi ini terhadap kelestarian Harimau Sumatra? (Pilih semua jawaban yang benar dengan memberikan tanda centang pada kotak)", "t": "PGK", "o": ["Terjadi peningkatan *genetic drift* (hanyutan genetik) yang dapat secara acak menghilangkan beberapa alel langka dari populasi kecil.", "Proses spesiasi alopatrik akan terjadi dengan cepat, menghasilkan subspesies harimau baru di setiap kantong hutan dalam beberapa dekade.", "Terjadi penurunan keanekaragaman genetik akibat perkawinan sedarah (*inbreeding*) yang meningkatkan kemunculan kelainan genetik resesif.", "Kemampuan adaptasi populasi harimau terhadap perubahan lingkungan (misalnya, wabah penyakit baru) akan menurun secara signifikan.", "Isolasi populasi akan mendorong evolusi konvergen, di mana harimau di kantong berbeda akan mengembangkan ciri yang sama persis untuk beradaptasi dengan lingkungan kebun sawit."], "e": "Fragmentasi habitat meningkatkan genetic drift dan inbreeding serta menurunkan kemampuan adaptasi. Pernyataan 2 (spesiasi cepat) dan 5 (konvergen dengan ciri sama persis) tidak tepat.", "key": [0, 2, 3], "sub": "Klasifikasi & Keanekaragaman Hayati"}, {"n": 6, "x": "Sebuah perusahaan bioteknologi mengklaim telah berhasil mengembangkan varietas padi baru bernama \"Padi Emas Super\" melalui rekayasa genetika. Padi ini diklaim tahan terhadap hama wereng dan kekeringan. Pemerintah berencana untuk mendistribusikan benih ini secara massal kepada petani di seluruh Indonesia untuk menggantikan varietas padi lokal. Analisislah potensi dampak kebijakan ini terhadap keanekaragaman hayati dari pernyataan berikut.", "t": "BS", "o": ["Penggunaan satu varietas unggul secara monokultur akan meningkatkan keanekaragaman hayati tingkat ekosistem sawah.", "Varietas padi lokal yang beragam di berbagai daerah terancam punah karena petani beralih ke varietas baru yang dianggap lebih menguntungkan.", "Hilangnya varietas padi lokal akan menyebabkan erosi genetik, yaitu hilangnya sumber daya genetik yang berpotensi berguna di masa depan.", "Keberhasilan padi rekayasa genetika ini secara otomatis akan mengurangi populasi hama wereng secara permanen di alam liar.", "Kebijakan ini merupakan contoh penerapan prinsip konservasi *ex-situ* untuk menjaga plasma nutfah padi Indonesia."], "e": "Monokultur menurunkan keanekaragaman; varietas lokal terancam dan terjadi erosi genetik; hama dapat berevolusi sehingga tidak hilang permanen; mengganti varietas lokal bukan konservasi ex-situ karena plasma nutfah lokal justru hilang.", "key": [false, true, true, false, false], "sub": "Klasifikasi & Keanekaragaman Hayati"}, {"n": 7, "x": "Ibu membuat yoghurt di rumah dengan menambahkan kultur bakteri *Lactobacillus bulgaricus* ke dalam susu hangat dan membiarkannya selama beberapa jam. Susu yang awalnya cair dan manis berubah menjadi kental dengan rasa asam yang khas. Peranan bakteri *Lactobacillus bulgaricus* dalam proses ini adalah...", "t": "PG", "o": ["Menguraikan sampah organik dalam susu", "Mengikat nitrogen dari udara ke dalam susu", "Melakukan fermentasi asam laktat", "Menyebabkan penyakit pada orang yang meminumnya", "Menghasilkan antibiotik untuk mengawetkan susu"], "e": "*Lactobacillus bulgaricus* memfermentasi laktosa menjadi asam laktat sehingga susu menjadi asam dan kental.", "key": 2, "sub": "Bakteri"}, {"n": 8, "x": "Perhatikan tabel berisi pernyataan-pernyataan dasar mengenai struktur dan peranan bakteri. Tentukan apakah setiap pernyataan berikut Benar atau Salah.", "t": "BS", "o": ["Semua jenis bakteri bersifat patogen atau menyebabkan penyakit bagi manusia.", "Bakteri tidak memiliki membran inti sehingga tergolong organisme prokariotik.", "*Escherichia coli* yang hidup di usus besar manusia membantu proses pembusukan sisa makanan dan menghasilkan vitamin K.", "Bakteri berkembang biak secara seksual melalui proses yang disebut pembelahan biner.", "Dinding sel bakteri tersusun atas peptidoglikan."], "e": "Tidak semua bakteri patogen; bakteri prokariotik tanpa membran inti; *E. coli* di usus membantu pembusukan sisa makanan dan menghasilkan vitamin K; bakteri berkembang biak secara aseksual (pembelahan biner); dinding sel tersusun dari peptidoglikan.", "key": [false, true, true, false, true], "sub": "Bakteri"}, {"n": 9, "x": "Seorang analis laboratorium melakukan prosedur pewarnaan Gram terhadap sampel bakteri dari seorang pasien. Hasilnya, di bawah mikroskop bakteri tersebut tampak berwarna ungu. Kesimpulan yang paling tepat mengenai struktur dinding sel bakteri tersebut adalah...", "t": "PG", "o": ["Memiliki lapisan peptidoglikan yang tipis dan membran luar", "Tidak memiliki lapisan peptidoglikan sama sekali", "Memiliki lapisan peptidoglikan yang tebal dan tidak memiliki membran luar", "Memiliki dinding sel yang tersusun dari selulosa", "Memiliki kapsul tebal yang menyerap warna ungu"], "e": "Bakteri Gram-positif berwarna ungu: peptidoglikan tebal dan tidak memiliki membran luar.", "key": 2, "sub": "Bakteri"}, {"n": 10, "x": "Seorang pasien didiagnosis menderita infeksi saluran kemih yang disebabkan oleh bakteri *Escherichia coli*. Setelah dilakukan pewarnaan Gram, diketahui bahwa bakteri ini tergolong Gram-negatif. Manakah pernyataan yang benar terkait karakteristik dan implikasi klinis dari bakteri Gram-negatif ini? (Pilih semua jawaban yang benar)", "t": "PGK", "o": ["Dinding selnya memiliki lapisan peptidoglikan yang sangat tebal.", "Memiliki membran luar yang mengandung Lipopolisakarida (LPS).", "Saat terjadi infeksi parah, LPS pada dinding selnya dapat dilepaskan sebagai endotoksin yang memicu demam tinggi pada pasien.", "Bakteri ini akan tampak berwarna ungu jika diamati dengan mikroskop setelah prosedur pewarnaan Gram.", "Keberadaan membran luar membuatnya lebih resisten terhadap beberapa jenis antibiotik, seperti penisilin."], "e": "Bakteri Gram-negatif berpeptidoglikan tipis, berwarna merah/merah muda setelah pewarnaan Gram, memiliki membran luar berisi LPS (endotoksin) yang membuatnya lebih resisten terhadap beberapa antibiotik.", "key": [1, 2, 4], "sub": "Bakteri"}, {"n": 11, "x": "Rian menderita infeksi bakteri dan diberi resep antibiotik oleh dokter untuk diminum selama 7 hari. Setelah 3 hari, Rian merasa gejalanya sudah hilang dan memutuskan untuk berhenti meminum antibiotik. Analisislah konsekuensi dari tindakan Rian tersebut berdasarkan prinsip resistensi bakteri.", "t": "BS", "o": ["Tindakan Rian sudah tepat karena gejala yang hilang menandakan seluruh bakteri penyebab infeksi telah mati.", "Bakteri yang masih bertahan hidup setelah 3 hari kemungkinan besar adalah varian yang paling rentan terhadap antibiotik tersebut.", "Sisa bakteri yang bertahan hidup dapat berkembang biak dan membentuk populasi baru yang seluruhnya kebal (resisten) terhadap antibiotik yang sama.", "Jika di masa depan Rian terinfeksi oleh bakteri keturunan ini, maka pengobatan dengan antibiotik yang sama tidak akan efektif lagi.", "Perilaku tidak disiplin dalam mengonsumsi antibiotik seperti ini merupakan salah satu faktor utama pendorong evolusi *superbugs* (bakteri super)."], "e": "Gejala hilang tidak berarti semua bakteri mati; bakteri yang bertahan justru varian yang paling tahan (resisten), yang kemudian berkembang biak dan menurunkan sifat resistensinya.", "key": [false, false, true, true, true], "sub": "Bakteri"}, {"n": 12, "x": "Terjadi wabah keracunan makanan di sebuah acara. Beberapa orang yang mengonsumsi hidangan ayam yang kurang matang mengalami gejala parah: demam tinggi, diare hebat, dan penurunan tekanan darah drastis yang mengarah pada syok septik. Analisis di laboratorium mengidentifikasi bakteri *Salmonella sp.* (sebuah bakteri Gram-negatif) sebagai penyebabnya. Berdasarkan skenario ini, manakah analisis biologis dan medis yang paling akurat? (Pilih semua jawaban yang benar)", "t": "PGK", "o": ["Gejala syok septik kemungkinan besar disebabkan oleh eksotoksin yang secara aktif disekresikan oleh bakteri *Salmonella* saat masih hidup.", "Pemberian antibiotik bakterisidal (yang membunuh bakteri) secara agresif pada fase awal mungkin dapat memperburuk gejala syok untuk sementara waktu.", "Fakta bahwa penyebabnya adalah bakteri Gram-negatif sangat relevan, karena fragmen dinding selnya (endotoksin) yang dilepaskan saat bakteri hancur merupakan pemicu utama syok septik.", "Bakteri *Salmonella* kemungkinan besar tidak memiliki ribosom, sehingga tidak dapat memproduksi protein toksin.", "Penularan bakteri ini dari ayam ke manusia menunjukkan peranan bakteri sebagai dekomposer dalam rantai makanan."], "e": "Syok septik pada Gram-negatif dipicu endotoksin (LPS) dari dinding sel, bukan eksotoksin; antibiotik bakterisidal dapat melepaskan endotoksin secara mendadak. Salmonella memiliki ribosom dan bukan dekomposer dalam konteks ini.", "key": [1, 2], "sub": "Bakteri"}, {"n": 13, "x": "Di sebuah ekosistem sawah di Jawa Barat, terdapat komponen-komponen berikut: tanaman padi, belalang, katak, ular, bakteri pengurai, cahaya matahari, dan air. Dari daftar tersebut, yang termasuk dalam kelompok komponen biotik adalah...", "t": "PG", "o": ["Cahaya matahari, air, dan bakteri pengurai", "Padi, belalang, katak, dan ular", "Padi, belalang, katak, ular, dan bakteri pengurai", "Belalang, katak, ular, dan cahaya matahari", "Hanya tanaman padi"], "e": "Komponen biotik adalah makhluk hidup: padi, belalang, katak, ular, dan bakteri pengurai. Cahaya matahari dan air adalah komponen abiotik.", "key": 2, "sub": "Ekosistem"}, {"n": 14, "x": "Perhatikan tabel berisi pernyataan-pernyataan dasar mengenai interaksi dalam ekosistem. Tentukan apakah setiap pernyataan berikut Benar atau Salah.", "t": "BS", "o": ["Hubungan antara benalu yang menempel di pohon mangga adalah contoh simbiosis komensalisme.", "Dalam piramida energi, aliran energi terbesar terdapat pada tingkat trofik konsumen puncak.", "Siklus unsur seperti Nitrogen dan Karbon di alam terjadi melalui interaksi antara komponen biotik dan abiotik.", "Kompetisi intraspesifik terjadi antara dua individu dari spesies yang berbeda untuk memperebutkan sumber daya.", "Bakteri dan jamur berperan sebagai dekomposer yang mengembalikan unsur hara ke tanah."], "e": "Benalu bersifat parasitisme; energi terbesar ada pada produsen (dasar piramida); kompetisi antarspesies berbeda disebut interspesifik, sedangkan intraspesifik terjadi dalam satu spesies.", "key": [false, false, true, false, true], "sub": "Ekosistem"}, {"n": 15, "x": "Ekosistem terumbu karang di Bunaken, Sulawesi Utara, memiliki jaring-jaring makanan yang kompleks. Ikan-ikan kecil herbivora memakan alga yang tumbuh di karang. Ikan-ikan ini kemudian dimangsa oleh ikan predator yang lebih besar seperti kerapu. Kerapu, pada gilirannya, bisa dimangsa oleh hiu. Jika terjadi penangkapan ikan-ikan kecil herbivora secara berlebihan (*overfishing*), dampak langsung yang paling mungkin terjadi pada ekosistem tersebut adalah...", "t": "PG", "o": ["Populasi hiu akan meningkat karena mangsanya melimpah", "Populasi alga akan meledak (*algal bloom*) karena predatornya berkurang", "Populasi ikan kerapu akan meningkat karena saingannya berkurang", "Terumbu karang akan menjadi lebih sehat karena alga berkurang", "Populasi alga dan ikan kerapu tidak akan terpengaruh"], "e": "Berkurangnya herbivora pemakan alga menyebabkan alga tumbuh tak terkendali (algal bloom).", "key": 1, "sub": "Ekosistem"}, {"n": 16, "x": "Seorang peneliti sedang mengamati ekosistem hutan hujan tropis di Taman Nasional Gunung Leuser, Sumatra. Hutan ini memiliki kanopi yang lebat, kelembapan tinggi, dan dihuni oleh berbagai satwa seperti orang utan, harimau, dan berbagai jenis serangga. Manakah pernyataan yang secara akurat mendeskripsikan komponen dan interaksi di ekosistem ini? (Pilih semua jawaban yang benar)", "t": "PGK", "o": ["Tingkat kelembapan dan intensitas cahaya matahari yang mencapai dasar hutan merupakan komponen abiotik yang vital.", "Hubungan antara anggrek yang menempel di dahan pohon tinggi untuk mendapatkan sinar matahari adalah simbiosis parasitisme.", "Orang utan yang memakan buah-buahan dan membantu menyebarkan bijinya merupakan contoh interaksi mutualisme.", "Serangga yang memakan daun pohon berperan sebagai konsumen tingkat I (herbivora).", "Semua pohon di hutan tersebut menempati niche (relung) ekologis yang sama persis."], "e": "Anggrek epifit yang menempel pada pohon bersifat komensalisme (bukan parasitisme); setiap spesies menempati relung (niche) yang berbeda.", "key": [0, 2, 3], "sub": "Ekosistem"}, {"n": 17, "x": "Seorang siswa menguji aktivitas enzim katalase dari hati ayam dengan menambahkan larutan hidrogen peroksida (H₂O₂). Gelembung gas oksigen yang terbentuk diamati pada tiga suhu berbeda. Pada suhu 0°C terbentuk sedikit gelembung, pada suhu 37°C terbentuk banyak gelembung, dan pada suhu 70°C hampir tidak terbentuk gelembung. Penjelasan yang paling tepat mengenai hasil pada suhu 70°C adalah...", "t": "PG", "o": ["Substrat H₂O₂ habis lebih dahulu pada suhu tinggi sehingga tidak ada lagi bahan yang dapat diuraikan", "Energi aktivasi reaksi meningkat pada suhu tinggi sehingga enzim tidak lagi mampu menurunkannya", "Enzim berubah menjadi produk reaksi pada suhu tinggi sehingga jumlah enzim semakin berkurang", "Struktur tiga dimensi enzim rusak (denaturasi) sehingga sisi aktifnya tidak lagi sesuai dengan substrat", "Inhibitor kompetitif terbentuk pada suhu tinggi dan menempati sisi aktif enzim katalase"], "e": "Suhu 70°C jauh di atas suhu optimum sehingga enzim (protein) mengalami denaturasi: struktur tiga dimensinya berubah dan sisi aktif tidak lagi cocok dengan substrat. Enzim tidak habis terpakai dan tidak mengubah energi aktivasi menjadi lebih tinggi.", "key": 3, "sub": "Sel & Metabolisme"}, {"n": 18, "x": "Perhatikan tabel pernyataan mengenai proses katabolisme dan anabolisme dalam sel. Tentukan apakah setiap pernyataan berikut Benar atau Salah.", "t": "BS", "o": ["Sintesis protein dari asam amino merupakan contoh reaksi katabolisme yang membebaskan energi.", "Respirasi seluler merupakan reaksi katabolisme yang menghasilkan energi dalam bentuk ATP.", "Pada glikolisis, satu molekul glukosa dipecah menjadi dua molekul piruvat di dalam matriks mitokondria.", "Fotosintesis merupakan reaksi anabolisme karena menyusun molekul sederhana menjadi molekul kompleks dengan bantuan energi.", "Fermentasi alkohol menghasilkan ATP lebih banyak daripada respirasi aerob."], "e": "Sintesis protein adalah anabolisme (membutuhkan energi). Glikolisis terjadi di sitoplasma. Fermentasi menghasilkan ATP jauh lebih sedikit (2 ATP) dibanding respirasi aerob.", "key": [false, true, false, true, false], "sub": "Sel & Metabolisme"}, {"n": 19, "x": "Seorang peneliti mengukur laju reaksi enzim amilase terhadap substrat pati pada berbagai konsentrasi substrat, sedangkan konsentrasi enzim, suhu, dan pH dijaga tetap. Data hasil pengukuran ditunjukkan pada tabel berikut.", "table": {"h": ["Konsentrasi substrat (mM)", "Laju reaksi (µmol/menit)"], "r": [["1", "10"], ["2", "19"], ["4", "34"], ["8", "48"], ["16", "55"], ["32", "56"]]}, "note": "Berdasarkan data tersebut, manakah kesimpulan yang benar? (Pilih semua jawaban yang benar dengan memberikan tanda centang pada kotak)", "t": "PGK", "o": ["Pada konsentrasi substrat rendah (1 sampai 4 mM), laju reaksi meningkat hampir sebanding dengan penambahan substrat.", "Pada konsentrasi substrat 16 sampai 32 mM, laju reaksi hampir konstan karena sebagian besar sisi aktif enzim telah terikat substrat.", "Penambahan substrat akan terus meningkatkan laju reaksi secara proporsional berapa pun konsentrasi substratnya.", "Penambahan jumlah enzim pada konsentrasi substrat 32 mM kemungkinan besar dapat meningkatkan laju reaksi.", "Enzim habis terpakai pada konsentrasi substrat yang tinggi sehingga laju reaksi tidak lagi meningkat."], "e": "Laju reaksi mendekati maksimum (jenuh) pada substrat tinggi karena jumlah enzim menjadi faktor pembatas; menambah enzim akan meningkatkan laju. Pernyataan 3 salah (ada batas jenuh) dan 5 salah (enzim tidak habis terpakai dalam reaksi).", "key": [0, 1, 3], "sub": "Sel & Metabolisme"}, {"n": 20, "x": "Seorang pasien didiagnosis mengalami kebocoran katup bikuspid (mitral), yaitu katup yang terletak di antara atrium kiri dan ventrikel kiri. Katup ini tidak menutup rapat sehingga sebagian darah mengalir balik ke atrium kiri saat ventrikel kiri berkontraksi. Dampak langsung yang paling mungkin terjadi pada sistem sirkulasi pasien tersebut adalah...", "t": "PG", "o": ["Volume darah kaya oksigen yang dipompa ke aorta berkurang sehingga suplai oksigen ke jaringan menurun", "Darah kaya oksigen bercampur dengan darah miskin oksigen di atrium kanan sehingga kadar oksigen darah turun", "Darah miskin oksigen langsung mengalir ke aorta tanpa melewati paru-paru sehingga jaringan kekurangan oksigen", "Tekanan darah di arteri pulmonalis menurun karena darah mengalir balik menuju vena kava", "Aliran darah dari atrium kanan ke ventrikel kanan terhenti karena katup trikuspid menutup permanen"], "e": "Aliran balik ke atrium kiri mengurangi volume darah beroksigen yang masuk ke aorta. Darah kaya oksigen tidak bercampur dengan darah miskin oksigen karena sisi kiri dan kanan jantung dipisahkan sekat.", "key": 0, "sub": "Sistem Sirkulasi"}, {"n": 21, "x": "Perhatikan tabel pernyataan mengenai struktur dan fungsi komponen sistem sirkulasi manusia. Tentukan apakah setiap pernyataan berikut Benar atau Salah.", "t": "BS", "o": ["Semua arteri membawa darah kaya oksigen dan semua vena membawa darah miskin oksigen.", "Katup pada vena berfungsi mencegah aliran balik darah, terutama pada vena di bagian tungkai.", "Pertukaran oksigen dan karbon dioksida antara darah dan jaringan terjadi di kapiler karena dindingnya sangat tipis.", "Trombosit berperan utama dalam mengangkut oksigen dari paru-paru ke seluruh jaringan tubuh.", "Dinding arteri lebih tebal dan elastis dibandingkan dinding vena karena arteri menerima tekanan darah yang tinggi dari jantung."], "e": "Arteri pulmonalis membawa darah miskin oksigen dan vena pulmonalis membawa darah kaya oksigen. Pengangkut oksigen adalah eritrosit, sedangkan trombosit berperan dalam pembekuan darah.", "key": [false, true, true, false, true], "sub": "Sistem Sirkulasi"}, {"n": 22, "x": "Seorang pendaki mendaki gunung hingga ketinggian lebih dari 2.000 meter di atas permukaan laut. Selama pendakian, ia merasa napasnya menjadi lebih cepat dan dalam. Setelah beberapa minggu berada di dataran tinggi, hasil pemeriksaan darahnya menunjukkan peningkatan jumlah eritrosit. Manakah analisis yang benar mengenai kondisi pendaki tersebut? (Pilih semua jawaban yang benar dengan memberikan tanda centang pada kotak)", "t": "PGK", "o": ["Tekanan parsial oksigen di udara yang lebih rendah mengurangi gradien difusi oksigen dari alveolus ke kapiler darah.", "Persentase gas oksigen di udara dataran tinggi turun jauh di bawah 21% karena udara menjadi lebih tipis.", "Peningkatan frekuensi napas tidak memengaruhi jumlah oksigen yang masuk maupun karbon dioksida yang dikeluarkan.", "Kemoreseptor yang mendeteksi penurunan oksigen dalam darah merangsang pusat pernapasan untuk meningkatkan laju napas.", "Peningkatan jumlah eritrosit membantu meningkatkan kapasitas darah dalam mengangkut oksigen ke jaringan."], "e": "Persentase oksigen di udara tetap sekitar 21%; yang menurun adalah tekanan parsialnya. Napas yang lebih cepat justru membantu meningkatkan pemasukan oksigen dan pengeluaran karbon dioksida.", "key": [0, 3, 4], "sub": "Sistem Respirasi"}, {"n": 23, "x": "Seorang siswa membuat model paru-paru dari botol plastik tanpa dasar. Sebuah balon dipasang pada mulut botol dan selembar karet dipasang pada dasar botol. Ketika karet ditarik ke bawah, balon di dalam botol mengembang. Peristiwa pada tubuh manusia yang sesuai dengan gerakan karet tersebut adalah...", "t": "PG", "o": ["Diafragma relaksasi dan melengkung ke atas sehingga tekanan udara dalam paru-paru meningkat", "Tulang rusuk bergerak turun akibat kontraksi otot antartulang rusuk dalam sehingga volume rongga dada mengecil", "Diafragma berkontraksi dan mendatar sehingga volume rongga dada membesar dan tekanan udara dalam paru-paru menurun", "Diafragma berkontraksi dan mendatar sehingga tekanan udara dalam paru-paru lebih tinggi daripada udara luar", "Otot antartulang rusuk luar relaksasi sehingga tulang rusuk terangkat dan volume rongga dada membesar"], "e": "Karet yang ditarik ke bawah menggambarkan diafragma yang berkontraksi dan mendatar sehingga volume rongga dada membesar, tekanan paru-paru turun, dan udara masuk (inspirasi).", "key": 2, "sub": "Sistem Respirasi"}, {"n": 24, "x": "Hasil pemeriksaan urin menunjukkan bahwa urin Pasien A mengandung glukosa, sedangkan urin Pasien B mengandung protein dan sel darah merah. Tentukan apakah setiap pernyataan berikut mengenai proses pembentukan urin Benar atau Salah.", "t": "BS", "o": ["Glukosa dalam urin Pasien A dapat terjadi jika kadar glukosa darah melampaui kapasitas reabsorpsi glukosa di tubulus kontortus proksimal.", "Pada orang sehat, urin primer mengandung protein darah dalam jumlah besar.", "Hormon ADH meningkatkan permeabilitas tubulus kolektivus terhadap air sehingga urin menjadi lebih pekat.", "Proses filtrasi darah yang menghasilkan urin primer terjadi di lengkung Henle.", "Protein dan sel darah merah dalam urin Pasien B menunjukkan kemungkinan terganggunya fungsi filtrasi di glomerulus."], "e": "Urin primer (filtrat glomerulus) tidak mengan const $=s=>document.querySelector(s);
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*([^*]+)\*/g,'<em>$1</em>');
const TYPE={PG:'Pilihan Ganda',PGK:'Pilihan Ganda Kompleks',BS:'Benar/Salah'};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{phase:'start'};let tmr,mode='all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const done=i=>{const a=S.ans[i],q=D[i];return q.t==='PG'?a!=null:q.t==='PGK'?a.length>0:a.some(x=>x!==null)};
function sc(i){const q=D[i],a=S.ans[i];
 if(q.t==='PG')return a===q.key?1:0;
 if(q.t==='PGK'){if(!a.length||a.some(x=>!q.key.includes(x)))return 0;return a.length===q.key.length?1:.5}
 const w=q.key.filter((k,j)=>a[j]!==k).length;return w===0?1:w===1?.5:0}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function render(){const a=$('#app');clearInterval(tmr);
 a.innerHTML=S.phase==='start'?startH():S.phase==='quiz'?quizH():resH();
 if(S.phase==='quiz'){tick();tmr=setInterval(tick,1000)}window.scrollTo(0,0)}
function startH(){return `<div class="card"><h1>Simulasi TKA Biologi SMA/MA 2026</h1><div class="mut">Paket 1 &bull; ${N} soal &bull; ${DUR/60} menit</div>
<p>Soal mencakup Keanekaragaman Hayati, Sel dan Metabolisme, serta Proses pada Makhluk Hidup, dengan tiga tipe: pilihan ganda, pilihan ganda kompleks, dan benar/salah.</p>
<label>Nama<input type="text" id="nm" placeholder="Nama peserta"></label><label>Kelas<input type="text" id="kl" placeholder="Contoh: XII IPA 1"></label>
<h2>Aturan penskoran</h2><ul class="mut"><li>Pilihan ganda: benar = 1 poin.</li><li>Pilihan ganda kompleks: semua pilihan benar dan tidak ada yang salah = 1 poin; sebagian benar tanpa pilihan salah = 0,5 poin.</li><li>Benar/Salah: semua pernyataan tepat = 1 poin; satu pernyataan keliru = 0,5 poin.</li><li>Skor simulasi = 200 + 600 &times; (poin &divide; ${N}), sehingga berkisar 200-800. Ini konversi linear untuk latihan, bukan skor resmi TKA.</li></ul>
<button class="btn" onclick="start()">Mulai Simulasi</button></div>`}
function start(){S={phase:'quiz',name:$('#nm').value.trim()||'Peserta',kls:$('#kl').value.trim(),end:Date.now()+DUR*1000,idx:0,flag:D.map(()=>false),
 ans:D.map(q=>q.t==='BS'?q.o.map(()=>null):q.t==='PGK'?[]:null)};save();render()}
function qh(i,rv){const q=D[i],a=S.ans[i],dis=rv?'disabled':'';
 let h=`<div class="qt">${esc(q.x)}</div>`;
 if(q.table)h+=`<div class="tw"><table><tr>${q.table.h.map(x=>`<th class="c">${esc(x)}</th>`).join('')}</tr>${q.table.r.map(r=>`<tr>${r.map(x=>`<td class="c">${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 if(q.img)h+=`<p style="text-align:center"><img src="${q.img}" alt="Berbagai macam buah mangga" style="max-width:100%;border-radius:10px"></p>`;
 if(q.note)h+=`<p class="${q.table?'':'note'}">${esc(q.note)}</p>`;
 if(q.t==='PG')h+=q.o.map((o,j)=>`<label class="op ${rv?(j===q.key?'ok':a===j?'bad':''):''}"><input type="radio" name="r${i}" ${a===j?'checked':''} ${dis} onchange="pk(${i},${j})"><span><b>${L[j]}.</b> ${esc(o)}</span></label>`).join('');
 else if(q.t==='PGK')h+=q.o.map((o,j)=>`<label class="op ${rv?(q.key.includes(j)?'ok':a.includes(j)?'bad':''):''}"><input type="checkbox" ${a.includes(j)?'checked':''} ${dis} onchange="tg(${i},${j})"><span>${esc(o)}</span></label>`).join('');
 else h+=`<div class="tw"><table><tr><th>No.</th><th>Pernyataan</th><th class="c">Benar</th><th class="c">Salah</th></tr>${q.o.map((o,j)=>{const c=v=>rv&&q.key[j]===v?' style="background:var(--okb)"':rv&&a[j]===v?' style="background:var(--badb)"':'';
 return `<tr><td>${j+1}</td><td>${esc(o)}</td>${[true,false].map(v=>`<td class="c"${c(v)}><input type="radio" name="b${i}_${j}" ${a[j]===v?'checked':''} ${dis} onchange="bs(${i},${j},${v})"></td>`).join('')}</tr>`}).join('')}</table></div>`;
 return h}
function panel(){return D.map((q,i)=>`<button class="nb ${S.flag[i]?'f':done(i)?'d':''} ${i===S.idx?'c':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function quizH(){const i=S.idx,q=D[i],n=S.ans.filter((_,k)=>done(k)).length;
 return `<div class="card"><div class="top"><div><b>${esc(S.name)}</b> <span class="mut">${esc(S.kls||'')}</span></div><span class="tm" id="tm"></span></div>
<div class="pb"><i id="pg" style="width:${n/N*100}%"></i></div><div class="mut" id="pt">Terjawab ${n} dari ${N} soal</div></div>
<div class="card"><span class="tag">Soal ${i+1} dari ${N}</span><span class="tag">${TYPE[q.t]}</span><span class="tag">${esc(q.sub)}</span>${qh(i,false)}
<div class="nav"><button class="btn s" onclick="go(${i-1})" ${i===0?'disabled':''}>Sebelumnya</button><button class="btn w2" onclick="fl()">${S.flag[i]?'Batalkan Ragu-ragu':'Ragu-ragu'}</button>
${i<N-1?`<button class="btn" onclick="go(${i+1})">Selanjutnya</button>`:`<button class="btn" onclick="ask()">Selesai</button>`}</div></div>
<div class="card"><h2>Nomor Soal</h2><div class="pn" id="pn">${panel()}</div><div class="lg"><span><b style="background:var(--ln)"></b>Belum dijawab</span><span><b style="background:var(--ok)"></b>Terjawab</span><span><b style="background:var(--wr)"></b>Ragu-ragu</span><span><b style="border:2px solid var(--pri)"></b>Soal ini</span></div>
<p><button class="btn s" onclick="ask()">Akhiri Simulasi</button></p></div>
<div class="ov" id="ov" hidden><div class="card"><h2>Akhiri simulasi?</h2><p id="om"></p><div class="nav"><button class="btn s" onclick="$('#ov').hidden=true">Kembali mengerjakan</button><button class="btn" onclick="fin()">Ya, akhiri</button></div></div></div>`}
function upd(){save();$('#pn').innerHTML=panel();const n=S.ans.filter((_,k)=>done(k)).length;$('#pg').style.width=n/N*100+'%';$('#pt').textContent=`Terjawab ${n} dari ${N} soal`}
const pk=(i,j)=>{S.ans[i]=j;upd()},tg=(i,j)=>{const a=S.ans[i],k=a.indexOf(j);k<0?a.push(j):a.splice(k,1);upd()},bs=(i,j,v)=>{S.ans[i][j]=v;upd()};
const go=i=>{if(i<0||i>=N)return;S.idx=i;save();render()},fl=()=>{S.flag[S.idx]=!S.flag[S.idx];save();render()};
function ask(){const u=S.ans.filter((_,k)=>!done(k)).length,r=S.flag.filter(Boolean).length;
 $('#om').textContent=(u?`Masih ada ${u} soal yang belum dijawab. `:'Semua soal sudah dijawab. ')+(r?`Ada ${r} soal bertanda ragu-ragu. `:'')+'Setelah diakhiri, jawaban tidak dapat diubah.';$('#ov').hidden=false}
function fin(){S.phase='result';S.fin=Date.now();save();render()}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000)),t=$('#tm');if(t){t.textContent='Sisa waktu '+fmt(r);t.className='tm'+(r<300?' warn':'')}if(r<=0)fin()}
function resH(){const p=D.reduce((s,_,i)=>s+sc(i),0),skor=Math.round(200+600*p/N);
 const pr=skor>=700?'Sangat Baik. Pemahamanmu sudah kuat, pertahankan!':skor>=550?'Baik. Sedikit lagi menuju capaian sangat baik.':skor>=400?'Cukup. Terus berlatih pada materi yang masih perlu diperkuat.':'Mulai Berkembang. Pelajari pembahasan lalu coba lagi, kamu pasti bisa meningkat.';
 const full=D.filter((_,i)=>sc(i)===1).length,half=D.filter((_,i)=>sc(i)===.5).length,sk=D.filter((_,i)=>!done(i)).length;
 const g={};D.forEach((q,i)=>{(g[q.sub]=g[q.sub]||[0,0]);g[q.sub][0]+=sc(i);g[q.sub][1]++});
 return `<div class="card" style="text-align:center"><div class="mut">Hasil Simulasi untuk ${esc(S.name)} ${esc(S.kls||'')}</div><div class="big">${skor}</div><div class="mut">Skor simulasi (rentang 200-800)</div><p><b>${pr}</b></p>
<p class="mut">Poin ${p.toString().replace('.',',')} dari ${N} &bull; Benar penuh ${full} &bull; Benar sebagian ${half} &bull; Tidak dijawab ${sk}</p></div>
<div class="card"><h2>Capaian per Materi</h2>${Object.entries(g).map(([k,v])=>{const c=Math.round(v[0]/v[1]*100);return `<div class="bar"><span>${esc(k)}</span><div><i style="width:${c}%"></i></div><b>${c}%</b></div>`}).join('')}
<p class="mut">Materi dengan capaian di bawah 60% bisa menjadi prioritas belajar berikutnya.</p></div>
<div class="card"><h2>Pembahasan</h2><button class="btn ${mode==='all'?'':'s'}" onclick="mode='all';render2()">Semua soal</button> <button class="btn ${mode==='wrong'?'':'s'}" onclick="mode='wrong';render2()">Soal belum tepat</button> <button class="btn s" onclick="again()">Ulangi Simulasi</button></div><div id="rv">${rvH()}</div>`}
function render2(){$('#app').innerHTML=resH()}
function keyT(q){return q.t==='PG'?L[q.key]:q.t==='PGK'?q.key.map(k=>k+1).join(', '):q.key.map((k,j)=>`${j+1} ${k?'Benar':'Salah'}`).join(', ')}
function rvH(){return D.map((q,i)=>{const s=sc(i);if(mode==='wrong'&&s===1)return '';
 return `<div class="card"><span class="tag">Soal ${i+1}</span><span class="st ${s===1?'b':s?'p':'s'}">${s===1?'Benar':s?'Benar sebagian':done(i)?'Belum tepat':'Tidak dijawab'}</span>${qh(i,true)}
<div class="ex"><b>Kunci: ${keyT(q)}</b><br>${esc(q.e)}</div></div>`}).join('')||'<div class="card">Semua jawabanmu sudah tepat. Luar biasa!</div>'}
function again(){S={phase:'start'};save();render()}
render();
</script></body></html>
